<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexV Panel</title>
<!-- The app's own mark, at the sizes each platform actually asks for. The
     paths are relative so they resolve under the panel's secret base path and
     under a reseller's slug without either being written down here. -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="mask-icon" href="icons/icon-mono.svg" color="#d7dae2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#191a1f">
<meta name="application-name" content="NexV Panel">
<meta name="apple-mobile-web-app-title" content="NexV">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<script>
/* Before the first paint, not after: the look is a preference this browser
   already holds, and reading it from a script at the foot of the page means a
   flash of somebody else's panel on every single load. */
(function () {
  var html = document.documentElement;
  var get = function (key, fallback) {
    try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; }
  };
  html.dataset.theme = get('nexv-theme', 'dark');
  html.dataset.skin = get('nexv-skin', 'glass');

  /*
   * Installed on a phone, the browser paints the bar above the page with
   * theme-color. A fixed value means somebody running the light Sunset skin
   * gets a graphite strip over a cream panel, so it is read back off the
   * stylesheet once the ground is known and kept in step with it.
   */
  var paintBar = function () {
    try {
      var ground = getComputedStyle(html).getPropertyValue('--bg').trim();
      if (!ground) return;
      var tag = document.querySelector('meta[name="theme-color"]');
      if (tag) tag.setAttribute('content', ground);
    } catch (_) { /* the page is fine without it */ }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paintBar);
  else paintBar();
  window.__NEXV_PAINT_BAR__ = paintBar;
})();
</script>
</head>
<body dir="ltr">
<!-- the only background there is: a still dot field, and one light that
     drifts across it. Everything else on the page is glass over these two. -->
<div class="bg-dots" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"><i></i></div>
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="brand-mark sm">N</div>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <span class="chip" id="xrayChip"><i></i><span>—</span></span>
      <button class="lang-key" id="langToggle" type="button" title="Language">EN</button>
      <button class="theme-switch" id="themeToggle" type="button" role="switch" title="Light or dark">
        <span class="ts-mark ts-sun" data-icon="sun"></span>
        <span class="ts-mark ts-moon" data-icon="theme"></span>
        <span class="ts-knob"><span class="ts-face"></span></span>
      </button>
      <button class="btn icon ghost desk-only" id="logoutBtn" title="Sign out"><span data-icon="logout"></span></button>
    </header>
    <div class="content" id="view">
      <!-- Shown from the first byte of the page, before any script has
           arrived, and replaced the moment the panel draws. On a slow or
           overloaded server the scripts can take a while, and an empty frame
           with no word of explanation is indistinguishable from a broken
           panel. -->
      <div class="card" id="bootWait" style="text-align:center;padding:28px 18px">
        <div class="skeleton" style="height:14px;width:60%;margin:0 auto 14px"></div>
        <div class="muted" id="bootMsg">Loading the panel… / در حال بارگذاری پنل…</div>
      </div>
    </div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
/* If the panel's script has not started after 15 seconds, say so and offer a
   way out, rather than leaving the loading line up for ever. app.js sets
   window.__nexvBooted the moment it runs. */
/* and any error before the panel's own handler exists, kept to be shown */
window.__nexvErrors = [];
window.addEventListener('error', function (e) {
  var f = String(e.filename || '').split('/').pop().split('?')[0];
  window.__nexvErrors.push((e.message || 'error') + (f ? ' (' + f + ':' + e.lineno + ':' + e.colno + ')' : ''));
});
setTimeout(function () {
  var m = document.getElementById('bootMsg');
  /* the script ran but never drew the page: say what it hit, if anything */
  if (window.__nexvBooted && m && document.getElementById('bootWait')) {
    m.innerHTML = 'The panel started but stopped before drawing.<br>پنل شروع شد ولی پیش از نمایش متوقف شد.<br><br>'
      + '<code style="direction:ltr;display:block;white-space:pre-wrap;text-align:left">'
      + (window.__nexvErrors.join('\n') || 'no error was reported').replace(/</g, '&lt;') + '</code><br>'
      + '<button class="btn primary" onclick="location.reload()">Try again / دوباره</button>';
    return;
  }
  if (window.__nexvBooted) return;
  if (!m) return;
  if (window.__nexvErrors.length) {
    m.innerHTML = 'This browser could not run the panel script.<br>این مرورگر نتوانست اسکریپت پنل را اجرا کند — مرورگر را به‌روز کنید یا مرورگر دیگری امتحان کنید.<br><br>'
      + '<code style="direction:ltr;display:block;white-space:pre-wrap;text-align:left">'
      + window.__nexvErrors.join('\n').replace(/</g, '&lt;') + '</code><br>'
      + '<button class="btn primary" onclick="location.reload()">Try again / دوباره</button>';
    return;
  }
  m.innerHTML = 'The server is answering slowly - it may be busy or under attack.<br>'
    + 'سرور کند جواب می‌دهد — ممکن است مشغول یا زیر حمله باشد.<br><br>'
    + '<button class="btn primary" onclick="location.reload()">Try again / دوباره</button>';
}, 15000);
</script>
<script src="i18n-core.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
