<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in | NexV Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236c8cff'/><text x='50' y='71' font-size='62' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>N</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body dir="ltr">
<!-- the only background there is: a still dot field, and one light that
     drifts across it. Everything else on the page is glass over these two. -->
<div class="bg-dots" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"><i></i></div>
<div class="login-wrap">
  <!-- the two things a person may want before they can reach Settings -->
  <div class="login-keys">
    <button class="lang-key" id="langToggle" type="button" data-en-title="Language" title="Language">EN</button>
    <button class="theme-switch" id="themeToggle" type="button" role="switch" data-en-title="Light or dark" title="Light or dark">
      <span class="ts-mark ts-sun" data-icon="sun"></span>
      <span class="ts-mark ts-moon" data-icon="theme"></span>
      <span class="ts-knob"><span class="ts-face"></span></span>
    </button>
  </div>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div>
        <div class="brand-name">NexV Panel</div>
        <div class="brand-sub" data-en="Xray-core management">Xray-core management</div>
      </div>
    </div>
    <div class="login-title" data-en="Welcome back">Welcome back</div>
    <div class="login-sub" data-en="Sign in to manage your server">Sign in to manage your server</div>

    <div class="field">
      <label for="username" data-en="Username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password" data-en="Password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <div id="error" class="chip danger hidden" style="width:100%;justify-content:center;margin-bottom:14px"></div>
    <button class="btn primary" type="submit" style="width:100%" id="submitBtn" data-en="Sign in">Sign in</button>
  </form>
</div>

<script src="i18n.js"></script>
<script>
/* The panel may live under a secret base path, injected by the server. */
const BASE = window.__NEXV_BASE__ || './';

/* ---- the same two keys the panel's header carries ---- */
const I18N = window.NEXV_I18N;

/* the dictionary is the panel's own, so a word translated there is translated
   here too and there is no second copy to keep in step */
function paintLanguage() {
  document.getElementById('langToggle').textContent = I18N.lang() === 'fa' ? 'FA' : 'EN';
  for (const node of document.querySelectorAll('[data-en]')) {
    node.textContent = I18N.t(node.getAttribute('data-en'));
  }
  for (const node of document.querySelectorAll('[data-en-title]')) {
    node.setAttribute('title', I18N.t(node.getAttribute('data-en-title')));
  }
  const button = document.getElementById('submitBtn');
  if (!button.disabled) button.textContent = I18N.t('Sign in');
}

I18N.setLang(I18N.stored() || (document.documentElement.dataset.lang || 'en'));
document.getElementById('langToggle').addEventListener('click', () => {
  I18N.setLang(I18N.lang() === 'fa' ? 'en' : 'fa');
  paintLanguage();
});

/* the theme switch, in the small form the login page needs */
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('nexv-theme', theme); } catch (_) { /* private window */ }
  const face = document.querySelector('#themeToggle .ts-face');
  if (face) face.innerHTML = theme === 'light' ? SUN : MOON;
  document.getElementById('themeToggle').setAttribute('aria-checked', theme === 'light' ? 'false' : 'true');
}
const SUN = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2.5a1 1 0 0 1 1 1V22a1 1 0 1 1-2 0v-1.5a1 1 0 0 1 1-1Zm0-18a1 1 0 0 1 1 1V4a1 1 0 1 1-2 0V2.5a1 1 0 0 1 1-1ZM22 11a1 1 0 1 1 0 2h-1.5a1 1 0 1 1 0-2H22ZM3.5 11a1 1 0 1 1 0 2H2a1 1 0 1 1 0-2h1.5Z"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>';
for (const holder of document.querySelectorAll('[data-icon]')) {
  holder.innerHTML = holder.dataset.icon === 'sun' ? SUN : MOON;
}
let theme = 'dark';
try { theme = localStorage.getItem('nexv-theme') || 'dark'; } catch (_) { /* default */ }
applyTheme(theme);
document.getElementById('themeToggle').addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
});
paintLanguage();

/*
 * A reseller panel nobody has claimed yet asks for an account instead of a
 * sign-in. The address is the only secret protecting it, so this happens once
 * and then the page is an ordinary sign-in like any other.
 */
const RESELLER = window.__NEXV_RESELLER__ || null;
const REGISTER_TEXT = {
  title: 'Set up your panel',
  sub: 'Choose a username and password. This happens once.',
  go: 'Create my account'
};
const registering = () => !!(RESELLER && RESELLER.register);

function paintRegister() {
  if (!registering()) return;
  document.querySelector('.login-title').textContent = I18N.t(REGISTER_TEXT.title);
  document.querySelector('.login-sub').textContent = I18N.t(REGISTER_TEXT.sub);
  if (!submitBtn.disabled) submitBtn.textContent = I18N.t(REGISTER_TEXT.go);
  document.getElementById('password').setAttribute('autocomplete', 'new-password');
}
document.getElementById('langToggle').addEventListener('click', () => setTimeout(paintRegister, 0));
paintRegister();
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('error');
const submitBtn = document.getElementById('submitBtn');

function fail(message) {
  errorBox.textContent = message;
  errorBox.classList.remove('hidden');
  submitBtn.disabled = false;
  submitBtn.textContent = I18N.t(registering() ? REGISTER_TEXT.go : 'Sign in');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.classList.add('hidden');
  submitBtn.disabled = true;
  submitBtn.textContent = I18N.t('Signing in…');

  const abort = new AbortController();
  const timer = setTimeout(() => abort.abort(), 20000);
  let res;
  try {
    res = await fetch(`${BASE}api/${registering() ? 'register' : 'login'}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        slug: RESELLER ? RESELLER.slug : undefined
      }),
      signal: abort.signal
    });
  } catch (err) {
    clearTimeout(timer);
    return fail(err.name === 'AbortError' ? 'The server did not respond. Try again.' : 'Could not reach the server.');
  }
  clearTimeout(timer);

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    return fail(data.error === 'invalid credentials' ? 'Wrong username or password.' : (data.error || 'Sign-in failed.'));
  }

  submitBtn.textContent = 'Opening panel…';
  // if the panel page itself never loads, say so instead of spinning forever
  const stuck = setTimeout(() => fail('Signed in, but the panel page did not load. Check "nexv logs" on the server.'), 15000);
  window.addEventListener('pagehide', () => clearTimeout(stuck));
  location.href = BASE;
});
</script>
</body>
</html>
