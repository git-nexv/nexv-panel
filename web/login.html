<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in | NexV Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236c8cff'/><text x='50' y='71' font-size='62' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>N</text></svg>">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body dir="ltr">
<div class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div>
        <div class="brand-name">NexV Panel</div>
        <div class="brand-sub">Xray-core management</div>
      </div>
    </div>
    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to manage your server</div>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <div id="error" class="chip danger hidden" style="width:100%;justify-content:center;margin-bottom:14px"></div>
    <button class="btn primary" type="submit" style="width:100%" id="submitBtn">Sign in</button>
  </form>
</div>

<script>
/* The panel may live under a secret base path, injected by the server. */
const BASE = window.__NEXV_BASE__ || './';
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('error');
const submitBtn = document.getElementById('submitBtn');

function fail(message) {
  errorBox.textContent = message;
  errorBox.classList.remove('hidden');
  submitBtn.disabled = false;
  submitBtn.textContent = 'Sign in';
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.classList.add('hidden');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  const abort = new AbortController();
  const timer = setTimeout(() => abort.abort(), 20000);
  let res;
  try {
    res = await fetch(`${BASE}api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      }),
      signal: abort.signal
    });
  } catch (err) {
    clearTimeout(timer);
    return fail(err.name === 'AbortError' ? 'The server did not respond. Try again.' : 'Could not reach the server.');
  }
  clearTimeout(timer);

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    return fail(data.error === 'invalid credentials' ? 'Wrong username or password.' : (data.error || 'Sign-in failed.'));
  }

  submitBtn.textContent = 'Opening panel…';
  // if the panel page itself never loads, say so instead of spinning forever
  const stuck = setTimeout(() => fail('Signed in, but the panel page did not load. Check "nexv logs" on the server.'), 15000);
  window.addEventListener('pagehide', () => clearTimeout(stuck));
  location.href = BASE;
});
</script>
</body>
</html>
